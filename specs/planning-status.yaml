# planning-status.yaml

Discover-phase checklist for planning workflow.

## Schema

```yaml
workflows:
  survey-context:
    required: true
    status: done
  scope-work:
    required: true
    status: done
  research-first:
    required: false
    status: skipped
    note: "No external dependencies"
  elaborate-spec:
    required: false
    status: skipped
    note: "Can be skipped for this project"
  plan-release:
    required: true
    status: done
  slice-tasks:
    required: true
    status: done
  plan-work:
    required: true
    status: done
```

## Status

- `survey-context`: **done** (conventions just established)
- `scope-work`: **done** (scope defined in SCOPE_LATEST.yaml)
- `research-first`: **skipped** (no external dependencies)
- `elaborate-spec`: **skipped** (can be skipped for this project)
- `plan-release`: **done** (7 epics sequenced by WSJF)
- `slice-tasks`: **done** (e01 dashboard epic sliced: s01-s03)
- `plan-work`: **done** (detailed tasks with verify commands for s01-s03)

## Usage

- Tracks progress through the discover phase
- Each item corresponds to a bigpowers skill
- Update manually or via `run-planning` skill

## Notes

- All items must be true before moving to Plan phase
- Use `run-planning` skill to drive discover-phase progress
