# execution-status.yaml

Flat story/epic status tracking.

## Schema

```yaml
status: green  # e01s05 complete — host agent fallback verified working

epics:
  e01:
    title: Dashboard Live Metrics
    status: green  # all 5 stories complete and verified
    stories:
      - id: s01
        title: Host Metrics Streaming
        status: green
        verify: pnpm test
      - id: s02
        title: AggregateStats Component
        status: green
        verify: pnpm test
      - id: s03
        title: RPC Agent Client & Tests
        status: green
        verify: pnpm test
      - id: s04
        title: Individual Metric Graphs (SparklineGraph)
        status: green
        verify: pnpm test
      - id: s05
        title: Process Utility (ProcessList + RPC endpoint)
        status: green  # host agent fallback verified working end-to-end
        verify: pnpm test && node -e 'fetch("http://127.0.0.1:5678/rpc/monitor/processes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({json:{}})}).then(r=>r.json()).then(d=>{const n=d?.json?.processes?.length||0;process.exit(n>0?0:1)})'

stories:
  s01:
    epic_id: e01
    title: Host Metrics Streaming
    status: green
    verify: pnpm test lib/rpc/procedures/monitor.test.ts
  s02:
    epic_id: e01
    title: AggregateStats Component
    status: green
    verify: pnpm test
  s03:
    epic_id: e01
    title: RPC Agent Client & Tests
    status: green
    verify: pnpm test lib/rpc/agent/client.test.ts
  s04:
    epic_id: e01
    title: Individual Metric Graphs (SparklineGraph)
    status: green
    verify: pnpm test
  s05:
    epic_id: e01
    title: Process Utility (ProcessList + RPC endpoint)
    status: green  # host agent fallback verified working end-to-end
    verify: pnpm test && node -e 'fetch("http://127.0.0.1:5678/rpc/monitor/processes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({json:{}})}).then(r=>r.json()).then(d=>{const n=d?.json?.processes?.length||0;process.exit(n>0?0:1)})'
```

## Usage

- Top-level `status` is overall project status
- `epics` and `stories` provide parallel indexing
- Each story has a `verify` command for testing
- Status values: green (complete), amber (in progress), red (blocked)

## Notes

- Keep in sync with release-plan.yaml epics
- Use `build-epic` skill to manage this file
