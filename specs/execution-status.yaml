# execution-status.yaml

Flat story/epic status tracking.

## Schema

```yaml
status: amber  # amber — e01s05 has host agent dependency (ADR-003)

epics:
  e01:
    title: Dashboard Live Metrics
    status: amber  # amber — host agent dependency (ADR-003)
    stories:
      - id: s01
        title: Host Metrics Streaming
        status: green
        verify: pnpm test
      - id: s02
        title: AggregateStats Component
        status: green
        verify: pnpm test
      - id: s03
        title: RPC Agent Client & Tests
        status: green
        verify: pnpm test
      - id: s04
        title: Individual Metric Graphs (SparklineGraph)
        status: green
        verify: pnpm test
      - id: s05
        title: Process Utility (ProcessList + RPC endpoint)
        status: amber  # amber — host agent dependency (ADR-003)
        verify: pnpm test

stories:
  s01:
    epic_id: e01
    title: Host Metrics Streaming
    status: green
    verify: pnpm test lib/rpc/procedures/monitor.test.ts
  s02:
    epic_id: e01
    title: AggregateStats Component
    status: green
    verify: pnpm test
  s03:
    epic_id: e01
    title: RPC Agent Client & Tests
    status: green
    verify: pnpm test lib/rpc/agent/client.test.ts
  s04:
    epic_id: e01
    title: Individual Metric Graphs (SparklineGraph)
    status: green
    verify: pnpm test
  s05:
    epic_id: e01
    title: Process Utility (ProcessList + RPC endpoint)
    status: amber  # amber — host agent dependency (ADR-003)
    verify: pnpm test
```

## Usage

- Top-level `status` is overall project status
- `epics` and `stories` provide parallel indexing
- Each story has a `verify` command for testing
- Status values: green (complete), amber (in progress), red (blocked)

## Notes

- Keep in sync with release-plan.yaml epics
- Use `build-epic` skill to manage this file
