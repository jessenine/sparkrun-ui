# state.yaml

Session state and workflow tracking for bigpowers.

## Schema

```yaml
workflow_mode: solo-git  # team-pr | solo-git (default)
active_flow: develop-tdd        # TDD test implementation for missing coverage
git:
  branch: feat/add-missing-tests
  commit: b97e352
  status: clean          # clean | dirty
handoff:
  next_skill: develop-tdd    # continue: portCheck, metrics-collector, workloadStatus, components
  completed_skills: [investigate-bug, audit-code, develop-tdd, validate-fix, test-plan]
metrics:
  story_start: "2026-08-07T18:57:00Z"  # test plan creation
  story_progress: 55  # P0 RPC logic coverage largely complete (status/helpers/run)
completed_work:
  - "BUG cycle: BUG-20260807T184042 (EACCES fix) — resolved and deployed"
  - "test(draft): draft lifecycle unit tests — 5 tests for SC-P0-21, SC-P0-22"
  - "test(monitor): monitor RPC procedure tests — for SC-P0-32, SC-P0-33"
  - "test(recipes): RPC schema tests — for SC-P0-39, SC-P0-40"
  - "test(status): mapStatusToJobs extraction + tests — SC-P0-34 (RED/GREEN)"
  - "test(helpers): resolveTargetHosts tests (explicit/cluster/default/missing)"
  - "test(run): buildRunArgs extraction + tests — SC-P0-47 (RED/GREEN)"
  - "scripts/verify-tdd-red-commit.sh: TDD cycle enforcement script"
epic:
  current_epic_id: e01
  current_story_id: e01s05
  current_tasks: [t01, t02, t03, t04, t05, t06]  # all 6 implementation tasks complete
  known_defects:
    - BUG-20260807T062700: "Process list always empty — resolved via host agent fallback (ADR-003)"
    - BUG-20260807T162700: "Dashboard metrics and graphs not showing — resolved (sparkrun installed via pip)"
    - BUG-20260807T162715: "Recipes page returns 500 — resolved (sparkrun installed via pip)"
    - BUG-20260807T184042: "Recipe validation fails with EACCES on draft directory — resolved (chmod 777 on draft dir)"
  test_coverage:
    high: "lib/draft.ts, lib/rpc/procedures/monitor.ts, lib/rpc/procedures/recipes.ts schemas"
    medium: "lib/rpc/procedures/helpers.ts, lib/rpc/procedures/run.ts, lib/portCheck.ts"
    low: "lib/state.ts, lib/workloadStatus.ts, lib/metrics-collector.ts, app/components/"
```

## Usage

- `workflow_mode` signals the integration mode (team vs solo)
- `active_flow` indicates which workflow is in progress
- `git` block tracks the current git state
- `handoff.next_skill` passes control between skills
- `metrics.story_start` records when a story begins (not for timing measurements)
- `bug_cycle` tracks progress through the bug fix workflow
- `epic` block tracks current epic and story in build_epic workflow

## Notes

- This file is written dynamically; do not commit manually
- Use `bp-yaml-set` or direct edit to update values
- `state.yaml.lock` is acquired/released dynamically
