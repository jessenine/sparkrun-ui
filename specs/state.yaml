# state.yaml

Session state and workflow tracking for bigpowers.

## Schema

```yaml
workflow_mode: solo-git  # team-pr | solo-git (default)
active_flow: build_epic        # build_epic | fix_bug | planning | null
git:
  branch: main
  commit: 279750e
  status: clean          # clean | dirty
handoff:
  next_skill: kickoff-branch   # ready to start feature branch for remaining tasks
  completed_skills: []
metrics:
  story_start: "2026-08-01T22:40:00Z"  # e01s05 starts
  story_progress: 95  # 5/6 tasks complete, awaiting modal, sort toggle, and data source fix
bug_cycle:
  current_step: null
  completed_steps: []    # completed step numbers
epic:
  current_epic_id: e01
  current_story_id: e01s05
  current_tasks: [t01, t02, t03, t04, t05, t06]  # implementation tasks for process utility - t05 and t06 remaining
```

## Usage

- `workflow_mode` signals the integration mode (team vs solo)
- `active_flow` indicates which workflow is in progress
- `git` block tracks the current git state
- `handoff.next_skill` passes control between skills
- `metrics.story_start` records when a story begins (not for timing measurements)
- `bug_cycle` tracks progress through the bug fix workflow
- `epic` block tracks current epic and story in build_epic workflow

## Notes

- This file is written dynamically; do not commit manually
- Use `bp-yaml-set` or direct edit to update values
- `state.yaml.lock` is acquired/released dynamically
