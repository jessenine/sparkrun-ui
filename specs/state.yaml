## Usage

- `workflow_mode` signals the integration mode (team vs solo)
- `active_flow` indicates which workflow is in progress
- `git` block tracks the current git state
- `handoff.next_skill` passes control between skills
- `metrics.story_start` records when a story begins (not for timing measurements)
- `bug_cycle` tracks progress through the bug fix workflow
- `epic` block tracks current epic and story in build_epic workflow

## Notes

- This file is written dynamically; do not commit manually
- Use `bp-yaml-set` or direct edit to update values
- `state.yaml.lock` is acquired/released dynamically
