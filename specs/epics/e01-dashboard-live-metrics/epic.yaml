## Description

Real-time cluster monitoring with live-updating metrics dashboard. Fixes the bug where metrics were showing 0.

## Stories

### s01 - Fix metrics normalization (BCP: 3, delta: MODIFIED)

**Title:** Fix normalizeMonitorOutput to correctly extract and flatten sample metrics

**Current behavior:** `normalizeMonitorOutput` function in `lib/rpc/procedures/monitor.ts` fails to correctly extract metrics from `sparkrun cluster monitor --json` output format, resulting in all hosts showing empty metrics (0).

**Expected behavior:** Dashboard displays real-time CPU, GPU, memory, power, and temperature metrics per host.

**Verification:** `pnpm test && pnpm typecheck`

### s02 - Connect to live streaming endpoint (BCP: 5, delta: MODIFIED)

**Title:** Connect dashboard to live metrics stream via oRPC

**Current behavior:** Metrics fetch on initial load, no live updates.

**Expected behavior:** Dashboard receives live updates every 2-3 seconds via oRPC eventIterator.

**Verification:** `pnpm dev` - open dashboard and verify live-updating metrics

### s03 - Build aggregate stats display component (BCP: 3, delta: MODIFIED)

**Title:** Aggregate stats display shows correct values from normalized metrics

**Current behavior:** AggregateStats shows 0 for all metrics due to normalized data being empty.

**Expected behavior:** Dashboard shows real averages across all hosts.

**Verification:** `pnpm test app/components/dashboard/AggregateStats.test.tsx`

### s05 - Process utility: Top 5 processes per host (BCP: 5, delta: ADDED)

**Title:** Show top 5 processes per host in the Host metrics section

**Current behavior:** Host metrics only show CPU, GPU, memory, power, and temperature aggregates.

**Expected behavior:** Each host's metrics card includes a "Top processes" section showing the 5 most resource-intensive processes (similar to `top` or `ps aux` summary).

**Features:**
- Display top 5 processes by CPU or memory usage (configurable toggle)
- Show: process name, CPU%, memory usage, PID
- Clicking a process name opens a modal with full `ps aux` output
- Data refreshes at the same interval as host metrics (currently 2s)

**Technical notes:**
- May need to extend sparkrun cluster monitor or add a new RPC endpoint for per-process metrics
- Consider performance: avoid fetching full `ps aux` for every process every 2s
- Can start with periodic sampling (e.g., every 10s) if performance is a concern

**Verification:** `pnpm test app/components/dashboard/ProcessList.test.tsx`
