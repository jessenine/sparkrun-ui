name: Agent Build

on:
  push:
    branches: [main]
    paths:
      - "agent/sparkrun-local-agent/**"
  pull_request:
    paths:
      - "agent/sparkrun-local-agent/**"
  workflow_dispatch:

concurrency:
  group: agent-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build agent for ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build agent binary
        uses: docker/build-push-action@v6
        with:
          context: ./agent/sparkrun-local-agent
          file: ./agent/sparkrun-local-agent/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: sparkrun-local-agent:latest

      - name: Extract binary
        run: |
          mkdir -p dist
          docker run --rm sparkrun-local-agent:latest cat /usr/local/bin/sparkrun-local-agent > dist/sparkrun-local-agent
          chmod +x dist/sparkrun-local-agent

      - name: Verify binary
        run: |
          file dist/sparkrun-local-agent
          echo "Binary details:"
          ls -la dist/sparkrun-local-agent

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sparkrun-local-agent-arm64
          path: dist/sparkrun-local-agent
          retention-days: 7

# DEPLOY job intentionally REMOVED (2026-08-08).
#
# The hosted-runner deploy job was not feasible and reddened main on every
# agent-path push:
#   1. GitHub-hosted runners cannot reach the private LAN IP (192.168.1.22) —
#      the SSH connection from the runner to the node always times out.
#   2. appleboy/ssh-action does not transfer files, so `cat > /tmp/...` wrote an
#      EMPTY binary (and it stopped the service first = took the agent offline).
#   3. jix has no NOPASSWORD sudo; the script needs a TTY & password, which a
#      hosted runner cannot provide.
#
# The `build` job above remains as an ARM64 compile gate and uploads the
# verified artifact `sparkrun-local-agent-arm64`. Deployment is manual:
#
#   Build once natively on an ARM node (has docker, no cross-toolchain needed):
#     tar -czf /tmp/agent-src.tgz Cargo.toml Cargo.lock src Dockerfile
#     -> copy to ARM node ->  docker build -t sparkrun-local-agent .
#     docker run --rm sparkrun-local-agent cat /usr/local/bin/sparkrun-local-agent >/tmp/a
#     -> copy /tmp/a to each target node as /tmp/sparkrun-local-agent.fixed ->
#   Per node (jix, needs sudo password interactively):
#     sudo systemctl stop sparkrun-local-agent
#     sudo cp /usr/local/bin/sparkrun-local-agent /usr/local/bin/sparkrun-local-agent.bak.$(date +%s)
#     sudo mv /tmp/sparkrun-local-agent.fixed /usr/local/bin/sparkrun-local-agent
#     sudo chmod +x /usr/local/bin/sparkrun-local-agent && sudo chown root:root /usr/local/bin/sparkrun-local-agent
#     sudo systemctl start sparkrun-local-agent
#   Verify: curl -s http://<node>:8081/processes   # expect hostname + ip_address
#
# If true self-service CD is ever wanted, the honest route is a SELF-HOSTED
# GitHub runner on the LAN (plus NOPASSWORD sudo for the exact commands), not a
# hosted runner. Draft that workflow when the infra exists.
