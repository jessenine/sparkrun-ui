apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sparkrun-local-agent
  namespace: sparkrun
  labels:
    app: sparkrun-local-agent
spec:
  selector:
    matchLabels:
      app: sparkrun-local-agent
  template:
    metadata:
      labels:
        app: sparkrun-local-agent
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sparkrun-local-agent
          image: sparkrun/sparkrun-local-agent:0.2.0
          ports:
            - containerPort: 8081
              hostPort: 8081
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: SPARKRUN_AGENT_PORT
              value: "8081"
            - name: SPARKRUN_AGENT_HOST
              value: "127.0.0.1"
            - name: SPARKRUN_AGENT_INTERVAL_MS
              value: "2000"
            - name: SPARKRUN_AGENT_MAX_PROCESSES
              value: "5"
          resources:
            limits:
              memory: 64Mi
              cpu: "100m"
            requests:
              memory: 32Mi
              cpu: "50m"
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: false
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: etc-passwd
              mountPath: /etc/passwd
              readOnly: true
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: etc-passwd
          hostPath:
            path: /etc/passwd
